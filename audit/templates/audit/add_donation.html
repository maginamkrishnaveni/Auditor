{% extends 'audit/base.html' %}
{% block title %}Add Donation{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="h4 mb-0">🤝 Add Donation</h3>
  <a href="{% url 'dashboard' session.id %}" class="btn btn-sm btn-outline-secondary">Back</a>
</div>

<form method="post" autocomplete="off">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label fs-5" for="id_amount">Donation amount (₹)</label>
    {{ form.amount }}
  </div>
  <div class="mb-3">
    <label class="form-label fs-5" for="id_person_name">Person name (optional)</label>
    {{ form.person_name }}
  </div>
  <div class="mb-3">
    <label class="form-label fs-5" for="id_mobile">Mobile (optional)</label>
    {{ form.mobile }}
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_notes">Notes (optional)</label>
    {{ form.notes }}
  </div>
  <button class="btn btn-primary btn-tap w-100" type="submit">Save Donation</button>
</form>
{% endblock %}
