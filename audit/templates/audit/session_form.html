{% extends 'audit/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h3 class="h4 mb-3">{{ title }}</h3>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label fs-5">Session name</label>
    {{ form.name }}
  </div>
  <div class="mb-3">
    <label class="form-label fs-5">Date</label>
    {{ form.date }}
  </div>
  <div class="mb-4">
    <label class="form-label fs-5">Location (optional)</label>
    {{ form.location }}
  </div>
  <button class="btn btn-success btn-tap w-100" type="submit">Create &amp; Open</button>
  <a href="{% url 'home' %}" class="btn btn-link w-100 mt-2">Cancel</a>
</form>
{% endblock %}
